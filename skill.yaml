version: "1.0.0"
name: "code-checker"
description: "Local-first source-code syntax checker with an optional local Ollama fallback."
author: "Code Checker Contributors"
license: "MIT"
repository: "https://github.com/satendrachauhan1/open-pr-reviewer"
entrypoint: "server.js"

interface:
  inputs:
    code:
      type: "string"
      description: "Source code to check."
      required: true
    language:
      type: "string"
      description: "Programming language of the source code."
      required: true
    model:
      type: "string"
      description: "Local Ollama model for languages without a built-in checker."
      default: "codellama:7b"
      required: false
  outputs:
    status:
      type: "string"
      enum: ["pass", "errors"]
      description: "Whether the checker found diagnostics."
    score:
      type: "integer"
      description: "100 when no diagnostics are returned; 0 when errors are returned."
    language:
      type: "string"
      description: "Language used for the check."
    source:
      type: "string"
      description: "Local syntax tool or Ollama model that performed the check."
    issues:
      type: "array"
      items:
        type: "object"
        properties:
          line:
            type: "integer"
            description: "Line where the issue was detected, when available."
          message:
            type: "string"
            description: "Diagnostic message."
          fix:
            type: "string"
            description: "Suggested correction, when available."
